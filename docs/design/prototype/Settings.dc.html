<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Gibi-o-matic — Settings</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#121317}
a{color:#F5C542}a:hover{color:#FFD970}
input:focus,select:focus{outline:2px solid #F5C542;outline-offset:1px}
</style>
</helmet>
<div style="min-height: 100vh; display: flex; flex-wrap: wrap; background: #121317; color: #ECEDEF; font-family: 'IBM Plex Sans', system-ui, sans-serif; font-size: 14px">

  <nav aria-label="Main navigation" style="flex: 1 1 232px; max-width: 260px; min-width: 220px; box-sizing: border-box; padding: 24px 16px; background: #17181D; border-right: 1px solid #262931; display: flex; flex-direction: column; gap: 28px">
    <div style="display: flex; align-items: center; gap: 10px; padding: 0 8px">
      <div style="width: 34px; height: 34px; border-radius: 9px; background: #F5C542; display: flex; align-items: center; justify-content: center">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#17181D" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="7" height="16" rx="1"></rect><rect x="12" y="4" width="4" height="16" rx="1"></rect><path d="M18 5l3 14"></path></svg>
      </div>
      <span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 21px; letter-spacing: -0.02em">Gibi-o-matic</span>
    </div>
    <div style="display: flex; flex-direction: column; gap: 4px">
      <a href="Main.dc.html" style="display: flex; align-items: center; gap: 12px; padding: 11px 12px; border-radius: 10px; color: #C9CCD3; text-decoration: none">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="9" rx="1.5"></rect><rect x="14" y="3" width="7" height="5" rx="1.5"></rect><rect x="14" y="12" width="7" height="9" rx="1.5"></rect><rect x="3" y="16" width="7" height="5" rx="1.5"></rect></svg>
        <span style="flex: 1">Library</span><span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #A3A8B3">661</span>
      </a>
      <a href="Inbox.dc.html" style="display: flex; align-items: center; gap: 12px; padding: 11px 12px; border-radius: 10px; color: #C9CCD3; text-decoration: none">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 12h-6l-2 3h-4l-2-3H2"></path><path d="M5.5 5h13L22 12v6a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2v-6z"></path></svg>
        <span style="flex: 1">Inbox</span><span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; background: #F5C542; color: #17181D; padding: 1px 7px; border-radius: 99px; font-weight: 500">3</span>
      </a>
      <a href="Review.dc.html" style="display: flex; align-items: center; gap: 12px; padding: 11px 12px; border-radius: 10px; color: #C9CCD3; text-decoration: none">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 11l3 3 8-8"></path><path d="M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h9"></path></svg>
        <span style="flex: 1">Review</span><span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; background: #F08A4B; color: #17181D; padding: 1px 7px; border-radius: 99px; font-weight: 500">79</span>
      </a>
      <a href="Editor.dc.html" style="display: flex; align-items: center; gap: 12px; padding: 11px 12px; border-radius: 10px; color: #C9CCD3; text-decoration: none">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"></path><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"></path></svg>
        <span style="flex: 1">Editor</span>
      </a>
      <a href="Destinations.dc.html" style="display: flex; align-items: center; gap: 12px; padding: 11px 12px; border-radius: 10px; color: #C9CCD3; text-decoration: none">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12v7a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-7"></path><path d="M16 6l-4-4-4 4"></path><path d="M12 2v13"></path></svg>
        <span style="flex: 1">Destinations</span><span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #A3A8B3">2</span>
      </a>
      <a href="Settings.dc.html" style="display: flex; align-items: center; gap: 12px; padding: 11px 12px; border-radius: 10px; background: #262931; color: #ECEDEF; text-decoration: none; font-weight: 600">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#F5C542" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M12 2v3"></path><path d="M12 19v3"></path><path d="M2 12h3"></path><path d="M19 12h3"></path><path d="M4.9 4.9l2.1 2.1"></path><path d="M17 17l2.1 2.1"></path><path d="M4.9 19.1L7 17"></path><path d="M17 7l2.1-2.1"></path></svg>
        <span style="flex: 1">Settings</span>
      </a>
    </div>
  </nav>

  <main style="flex: 999 1 640px; min-width: 0; box-sizing: border-box; padding: 28px 32px; display: flex; flex-direction: column; gap: 22px; max-width: 980px">
    <header>
      <h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 34px; letter-spacing: -0.025em">Settings</h1>
      <p style="margin: 4px 0 0; color: #A3A8B3">Komga, Kindle and other reading places are under <a href="Destinations.dc.html">Destinations</a>.</p>
    </header>

    <div role="tablist" aria-label="Sections" style="display: flex; flex-wrap: wrap; gap: 6px; border-bottom: 1px solid #262931; padding-bottom: 10px">
      <sc-for list="{{tabs}}" as="t" hint-placeholder-count="3">
        <button type="button" role="tab" onClick="{{t.pick}}" style="{{t.style}}">{{t.label}}</button>
      </sc-for>
    </div>

    <!-- Folders -->
    <sc-if value="{{show.folders}}" hint-placeholder-val="{{ true }}">
      <section aria-label="Folders" style="display: flex; flex-direction: column; gap: 14px">
        <sc-for list="{{folders}}" as="f" hint-placeholder-count="2">
          <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 16px 18px; border-radius: 14px; background: #1A1B21; border: 1px solid #262931">
            <div style="flex: 1 1 260px; min-width: 0">
              <div style="font-weight: 600">{{f.label}}</div>
              <div style="font-size: 12.5px; color: #A3A8B3; margin-top: 2px">{{f.help}}</div>
            </div>
            <label style="flex: 1 1 300px; display: flex; gap: 8px"><span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">{{f.label}}</span>
              <input value="{{f.path}}" style="flex: 1; min-width: 0; height: 42px; padding: 0 12px; border-radius: 9px; border: 1px solid #2E313A; background: #121317; color: #ECEDEF; font-family: 'IBM Plex Mono', monospace; font-size: 13px">
              <button type="button" style="height: 42px; padding: 0 14px; border-radius: 9px; border: 1px solid #2E313A; background: transparent; color: #ECEDEF; font: inherit; cursor: pointer">Choose</button>
            </label>
          </div>
        </sc-for>
      </section>
    </sc-if>

    <!-- Metadata -->
    <sc-if value="{{show.metadata}}" hint-placeholder-val="{{ false }}">
      <section aria-label="Metadata sources" style="display: flex; flex-direction: column; gap: 14px">
        <p style="margin: 0; color: #A3A8B3">Priority order: drag to reorder. The first source that answers with high confidence wins.</p>
        <sc-for list="{{sources}}" as="s" hint-placeholder-count="3">
          <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 14px; padding: 16px 18px; border-radius: 14px; background: #1A1B21; border: 1px solid #262931">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5B606B" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M8 6h.01"></path><path d="M8 12h.01"></path><path d="M8 18h.01"></path><path d="M16 6h.01"></path><path d="M16 12h.01"></path><path d="M16 18h.01"></path></svg>
            <span style="font-family: 'IBM Plex Mono', monospace; color: #A3A8B3">{{s.n}}</span>
            <div style="flex: 1 1 200px"><div style="font-weight: 600">{{s.name}}</div><div style="font-size: 12.5px; color: #A3A8B3">{{s.help}}</div></div>
            <sc-if value="{{s.needsKey}}" hint-placeholder-val="{{ false }}">
              <label style="flex: 0 1 260px"><span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">API key</span><input type="password" value="your-key-here" placeholder="Personal ComicVine key" style="width: 100%; box-sizing: border-box; height: 40px; padding: 0 12px; border-radius: 9px; border: 1px solid #2E313A; background: #121317; color: #ECEDEF; font-family: 'IBM Plex Mono', monospace"></label>
            </sc-if>
            <button type="button" role="switch" aria-checked="{{s.on}}" aria-label="{{s.aria}}" onClick="{{s.toggle}}" style="{{s.trackStyle}}"><span style="{{s.knobStyle}}"></span></button>
          </div>
        </sc-for>
      </section>
    </sc-if>

    <!-- General -->
    <sc-if value="{{show.general}}" hint-placeholder-val="{{ false }}">
      <section aria-label="General" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px">
        <label style="display: flex; flex-direction: column; gap: 6px"><span style="font-weight: 600">Language</span><select style="height: 44px; padding: 0 10px; border-radius: 9px; border: 1px solid #2E313A; background: #1A1B21; color: #ECEDEF; font: inherit"><option>Português (Brasil)</option><option>English</option></select></label>
        <label style="display: flex; flex-direction: column; gap: 6px"><span style="font-weight: 600">Theme</span><select style="height: 44px; padding: 0 10px; border-radius: 9px; border: 1px solid #2E313A; background: #1A1B21; color: #ECEDEF; font: inherit"><option>Dark</option><option>Light</option><option>Follow the system</option></select></label>
      </section>
    </sc-if>

    <footer style="display: flex; justify-content: flex-end; gap: 10px; margin-top: auto">
      <button type="button" style="height: 44px; padding: 0 18px; border-radius: 11px; border: 1px solid #2E313A; background: transparent; color: #ECEDEF; font: inherit; font-weight: 600; cursor: pointer">Restore default</button>
      <button type="button" style="height: 44px; padding: 0 22px; border-radius: 11px; border: 0; background: #F5C542; color: #17181D; font: inherit; font-weight: 600; cursor: pointer">Save</button>
    </footer>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":960}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { tab: 'folders', src: { 0: true, 1: true, 2: false } };
  }
  renderVals() {
    const defs = [['folders', 'Folders'], ['metadata', 'Metadata'], ['general', 'General']];
    const tabs = defs.map(([id, label]) => ({
      label,
      style: 'height: 38px; padding: 0 14px; border-radius: 9px; border: 0; font: inherit; cursor: pointer; ' + (this.state.tab === id ? 'background: #262931; color: #ECEDEF; font-weight: 600' : 'background: transparent; color: #A3A8B3'),
      pick: () => this.setState({ tab: id })
    }));
    const show = {};
    defs.forEach(([id]) => { show[id] = this.state.tab === id; });
    const folders = [
      { label: 'Archive (originals)', help: 'Where the originals and metadata live. Never modified.', path: 'G:\\My Drive\\Gibi-o-matic' },
      { label: 'Inbox', help: 'Watched folder for new downloads.', path: 'D:\\Downloads\\Humble' }
    ];
    const sd = [
      ['Open Library', 'Lookup by ISBN. No key.', false],
      ['ComicVine', 'Collected editions and single issues. Needs a personal key.', true],
      ['Google Books', 'By ISBN. Subject to a usage limit.', false]
    ];
    const sources = sd.map(([name, help, needsKey], i) => {
      const on = !!this.state.src[i];
      return {
        n: String(i + 1).padStart(2, '0'), name, help, needsKey, on, aria: 'Turn on ' + name,
        trackStyle: 'position: relative; width: 48px; height: 28px; flex: none; border-radius: 99px; border: 0; cursor: pointer; background: ' + (on ? '#F5C542' : '#3A3E48'),
        knobStyle: 'position: absolute; top: 3px; width: 22px; height: 22px; border-radius: 99px; background: #17181D; left: ' + (on ? '23px' : '3px'),
        toggle: () => this.setState({ src: { ...this.state.src, [i]: !on } })
      };
    });
    return { tabs, show, folders, sources };
  }
}
</script>
</body>
</html>
